name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: syntax + engine guarantees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No npm install: the game has zero runtime dependencies, and pulling Electron into
      # CI to prove nothing is how a repo starts failing on a network flake.
      - name: Syntax check every source
        run: |
          for f in $(git ls-files 'js/*.js' 'js/*/*.js'); do node --check "$f" || exit 1; done
          node --check server.cjs
          node --check electron/main.cjs
          node --check electron/preload.cjs
          for f in $(git ls-files 'tools/*.mjs' tools/scenarios.js); do node --check "$f" || exit 1; done

      # The real gate: every generated board must have one solution and be reachable by
      # pencil logic, and the two counters must agree cell by cell. A plain Node test, so
      # it guards merges without a browser.
      - name: Engine tests
        run: node tools/engine-test.mjs

      # The ladder is a promise, not a caption: `TIERS[].band` is a selection target, and this
      # step goes red if a tier stops landing in its own band or the medians stop ordering.
      - name: Difficulty ladder is still measured
        run: node tools/balance.mjs
        env:
          SAMPLES: "12"

      # The shipped levels are build-time output; this re-derives every printed number.
      - name: Baked campaign re-verifies
        run: node tools/bake.mjs --check

      - name: Entry files exist
        run: test -f index.html && grep -q '<canvas' index.html && grep -q 'js/main.js' index.html

      # Prose is a gate too: every number printed in README/DESIGN is re-derived from the engine on
      # the spot (20 shipped boards re-solved + re-counted, 24 live puzzles per tier, the fired-rule
      # census, the fixture table). The step is red if a doc number drifts OR if the gate itself
      # quietly loses assertions (DOCTEST_ROWS_WANT is pinned in tools/verify.sh).
      - name: Doc numbers match the engine (doctest)
        run: node tools/doctest.mjs

      # Green does not prove the gate can go red. The sabotage ledger writes each class of lie back
      # into the tree, one knife at a time, and requires tools/doctest.mjs to fail *naming* the
      # assertion it killed; then it restores from the bytes it read into memory before cutting.
      # Same command as `npm run sabotage` and the same one tools/verify.sh runs — no CI-only gate.
      - name: Sabotage ledger proves the doc gate bites
        run: node tools/sabotage.mjs
      # 部署集闸：按 tools/assemble-site.sh 那份清单真拷一遍产物，要求页面会去要的东西
      # 都在里面。这一仓曾经因为清单落后于页面而线上 404 自己的 manifest/sw.js/图标，
      # 而本地一切全绿——因为本地根本没有「按清单拷」这一步。
      - name: Deploy set gate
        run: node tools/deploy-set.mjs
      # 阴性自证：每一类断言当场被打红一次，闸必须点名吃掉那一刀；写在注释里的假路径
      # 必须不算引用。钉住的条数由这一跑证明它真的会红，不是由记性证明。
      - name: Deploy set gate proves it can fail
        run: node tools/deploy-set-selftest.mjs

  # The six steps above are Node-side. `tools/verify.sh` is the seventh gate and, until this job
  # existed, CI had never run it: 507 browser assertions per URL shape (first seed rules unique
  # play conflict hint stats) measured 2026-09-28 on the author's machine, twice, and never once on
  # a runner. A gate that is only ever run by hand is documentation, not a gate.
  browser:
    name: real browser gate (both URL shapes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # 22, not 20: the CDP driver uses the global WebSocket/fetch that only exist from Node 22.
        # On 20 the first attach dies and the job reports a missing browser, not a broken game.
        with:
          node-version: 22

      - name: Browser gate, root shape
        env:
          WD_TIMEOUT: 900
        run: bash tools/verify.sh

      # Pages serves this repo under /z-biz-game-skyscraper-cos/, and a server rooted at the repo
      # cannot tell a leading-slash import from a relative one: the same app 404s in production while
      # every local run is green. Two other repos in this org have already been burned by exactly
      # that, so the prefix shape is part of the gate rather than a footnote.
      - name: Browser gate, prefix shape (how Pages serves us)
        env:
          WD_TIMEOUT: 900
        run: |
          root=$(mktemp -d)
          ln -s "$GITHUB_WORKSPACE" "$root/z-biz-game-skyscraper-cos"
          python3 -m http.server 5512 --bind 127.0.0.1 --directory "$root" &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null' EXIT
          for i in $(seq 1 40); do
            curl -fsS -m 2 "http://127.0.0.1:5512/z-biz-game-skyscraper-cos/" >/dev/null 2>&1 && break
            sleep 0.25
          done
          curl -fsS -m 3 "http://127.0.0.1:5512/z-biz-game-skyscraper-cos/js/main.js" >/dev/null
          curl -fsS -m 3 "http://127.0.0.1:5512/z-biz-game-skyscraper-cos/js/engine/count.js" >/dev/null
          BASE_URL=http://127.0.0.1:5512/z-biz-game-skyscraper-cos/ bash tools/verify.sh
